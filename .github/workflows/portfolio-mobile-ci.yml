name: Carteira inteligente e celular

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend - indicadores e carteira
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: sqlite:///./ci_portfolio.sqlite3
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify syntax
        run: python -m compileall -q backend/app
      - name: Run portfolio and indicator regression tests
        run: python -m pytest -q tests/unit/test_smart_portfolio_engine.py tests/integration/test_recommendation_history_api.py tests/unit/test_recommendation_performance_service.py tests/integration/test_official_source_verification.py tests/unit/test_pre_purchase_audit_service.py tests/unit/test_financial_planning_engine.py tests/unit/test_emergency_reserve_engine.py tests/integration/test_emergency_reserve_api.py tests/unit/test_market_intelligence.py tests/unit/test_sector_relative_valuation.py tests/unit/test_stock_purchase_eligibility.py tests/unit/test_multimarket_scoring.py tests/unit/test_external_market_data_service.py tests/unit/test_bcb_ptax_fx.py tests/unit/test_free_render_neon_deployment.py
      - name: Test PostgreSQL URL driver selection
        run: python -m pytest -q tests/unit/test_database_url_normalization.py

  postgres_migrations:
    name: PostgreSQL - migracoes de banco vazio
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mesa_quant_ci
          POSTGRES_USER: mesa_ci
          POSTGRES_PASSWORD: temporary-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mesa_ci -d mesa_quant_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://mesa_ci:temporary-ci-only@localhost:5432/mesa_quant_ci
      SECRET_KEY: this-is-a-temporary-only-github-actions-test-secret
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run all migrations from empty PostgreSQL schema
        run: |
          cd backend
          python -m alembic upgrade head
          python -m alembic upgrade head
      - name: Test one-account recovery from local Postgres to isolated Neon-like Postgres
        env:
          ACCOUNT_RECOVERY_CI: "1"
          ACCOUNT_RECOVERY_SOURCE_URL: postgresql://mesa_ci:temporary-ci-only@localhost:5432/mesa_quant_ci
        run: python -m pytest -q tests/integration/test_local_account_recovery.py

      - name: Check migration schema agrees with application models
        run: |
          cd backend
          python - <<'PY'
          import app.models
          from sqlalchemy import inspect
          from app.core.database import Base, engine

          actual = set(inspect(engine).get_table_names())
          expected = set(Base.metadata.tables)
          missing = sorted(expected - actual)
          assert not missing, f"ORM tables absent after migrations: {missing}"
          for table in ("assets", "operations", "watchlists", "alerts", "manual_indicators"):
              assert table in actual
          indexes = {i["name"] for i in inspect(engine).get_indexes("assets")}
          assert "ix_assets_ticker" in indexes
          foreign_keys = inspect(engine).get_foreign_keys("manual_indicators")
          assert any(fk["referred_table"] == "assets" for fk in foreign_keys)
          print("All declared ORM tables and core constraints present without create_all")
          PY
      - name: Test recovery from old SQLite to disposable Postgres
        run: python -m pytest -q tests/unit/test_local_neon_recovery.py

  frontend:
    name: React - qualidade e interface
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend_web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  mobile:
    name: Android viewport - portfolio smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend_web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- e2e/planejar-quantidades.spec.ts
