name: Verificacao temporaria B314
on:
  push:
    branches:
      - security/fix-xml-parsing-audit
    paths:
      - backend/app/providers/b3/daily_price.py
      - backend/app/providers/b3/instruments.py
permissions:
  contents: write
jobs:
  bandit-b314:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/fix-xml-parsing-audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Bandit
        run: python -m pip install bandit==1.8.6
      - name: Scan and require no B314 XML parser findings
        run: |
          bandit -r backend/app -ll -f json -o bandit-report.json || true
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("bandit-report.json").read_text())
          findings = report.get("results", [])
          b314 = [item for item in findings if item.get("test_id") == "B314"]
          print(f"Bandit findings at medium severity or higher: {len(findings)}")
          for item in findings:
              print(f'{item.get("test_id")} {item.get("issue_severity")} {item.get("filename")}:{item.get("line_number")}')
          if b314:
              raise SystemExit(f"B314 findings remain: {len(b314)}")
          print("PASS: zero B314 findings")
          PY
      - name: Remove temporary validation workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-b314-temporary.yml
          git commit -m "ci(security): remove temporary B314 verification workflow"
          git push origin security/fix-xml-parsing-audit
