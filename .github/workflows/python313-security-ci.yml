name: Auditoria de seguranca Python 3.13

on:
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "backend/requirements.txt"
      - ".github/workflows/python313-security-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pyproject-python313:
    name: Dependencias raiz + testes em Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: sqlite:///./ci_security_py313.sqlite3
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar pacote raiz e ferramentas
        run: python -m pip install -e ".[dev]" pip-audit
      - name: Verificar consistencia das dependencias
        run: python -m pip check
      - name: Auditar dependencias do ambiente
        run: python -m pip_audit
      - name: Testes criticos da carteira e autenticacao
        run: |
          python -m pytest -q \
            tests/unit/test_jwt_migration_compatibility.py \
            tests/unit/test_email_auth.py \
            tests/integration/test_global_resource_authorization.py \
            tests/unit/test_smart_portfolio_engine.py \
            tests/unit/test_financial_planning_engine.py \
            tests/unit/test_emergency_reserve_engine.py \
            tests/integration/test_recommendation_history_api.py \
            tests/integration/test_emergency_reserve_api.py

  backend-requirements-python313:
    name: Dependencias backend em Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar requisitos backend e auditoria
        run: python -m pip install -r backend/requirements.txt pip-audit
      - name: Verificar dependencias instaladas
        run: python -m pip check
      - name: Verificar vulnerabilidades
        run: python -m pip_audit
