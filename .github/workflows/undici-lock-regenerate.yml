name: Atualizar package-lock seguro do undici
on:
  push:
    branches:
      - security/undici-8-12-2-20261022
    paths:
      - ".github/workflows/undici-lock-regenerate.yml"

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Gerar lockfile pela registry real do npm
        working-directory: frontend_web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verificar lockfile usando npm ci
        working-directory: frontend_web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Confirmar versao do undici
        working-directory: frontend_web
        run: |
          node -e "const lock=require('./package-lock.json');const vers=Object.entries(lock.packages).filter(([k,v]) => k.endsWith('/undici')).map(([k,v])=>v.version);if(vers.length===0||vers.some(v=>v!=='8.12.2')){console.error(vers);process.exit(1)}console.log('undici validado:',vers)"
      - name: Criar commit somente de package-lock.json
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- frontend_web/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile ja esta sincronizado"
          else
            git diff --cached --stat
            git commit -m "fix(security): atualizar lockfile para undici 8.12.2 via npm"
            git push origin HEAD:refs/heads/security/undici-8-12-2-20261022
          fi
