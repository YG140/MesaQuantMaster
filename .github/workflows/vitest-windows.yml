name: Vitest no Windows
on:
  pull_request:
    branches: [main]
    paths:
      - "frontend_web/vite.config.ts"
      - ".github/workflows/vitest-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vitest-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend_web/package-lock.json
      - name: Instalar dependencias exatas
        working-directory: frontend_web
        run: npm ci
      - name: Validar TypeScript
        working-directory: frontend_web
        run: npm run typecheck
      - name: Executar Vitest Windows (threads, unico worker)
        working-directory: frontend_web
        run: npm test -- --reporter=verbose
      - name: Compilar frontend
        working-directory: frontend_web
        run: npm run build
