name: Tests - Desktop Cloud Sync

on:
  pull_request:
    branches: [main]
    paths:
      - "start.ps1"
      - "Iniciar MesaQuantMaster.bat"
      - "Abrir MesaQuantMaster Sincronizado.bat"
      - "SINCRONIZACAO_PC_APK.md"
      - "tests/powershell/**"
      - ".github/workflows/desktop-cloud-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-pester:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Pester 4 (testes existentes)
        shell: powershell
        run: |
          Install-Module Pester -RequiredVersion 4.10.1 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -RequiredVersion 4.10.1 -Force
      - name: Executar testes Windows para os dois modos
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 4.10.1 -Force
          Invoke-Pester -Script .\tests\powershell\*.Tests.ps1 -EnableExit
