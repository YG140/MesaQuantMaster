name: Auditoria de seguranca — Fase 0

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets-history:
    name: Segredos no codigo e historico Git
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout completo para inspecionar o historico
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks — varredura historica com valores mascarados
        run: |
          set +e
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -v "${{ runner.temp }}:/reports" \
            zricethezav/gitleaks:v8.24.3 \
            git --log-opts="--all" --redact --report-format=json \
              --report-path=/reports/gitleaks-report.json --exit-code=1 /repo
          scan_status=$?
          if [ -f "${{ runner.temp }}/gitleaks-report.json" ]; then
            echo "Relatorio Gitleaks (segredos mascarados):"
            cat "${{ runner.temp }}/gitleaks-report.json"
          fi
          exit "$scan_status"

  python-sast:
    name: SAST Python — Bandit (diagnostico inicial)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar Bandit
        run: python -m pip install bandit==1.8.6
      - name: Gerar diagnostico sem bloquear a primeira linha de base
        run: bandit -r backend/app -ll --exit-zero --format txt

  frontend-dependencies:
    name: Dependencias frontend — npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend_web/package-lock.json
      - name: Instalar dependencias travadas
        run: npm ci
      - name: Bloquear vulnerabilidades altas ou criticas
        run: npm audit --audit-level=high
