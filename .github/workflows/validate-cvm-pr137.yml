name: Validacao isolada PR 137

on:
  push:
    branches:
      - ci/validate-cvm-pr137-20261122

permissions:
  contents: read

jobs:
  cvm-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: sqlite:///./ci_cvm.sqlite3
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend/app
      - name: Run CVM import regression suite
        run: python -m pytest -q tests/unit/test_cvm_financial_import.py
