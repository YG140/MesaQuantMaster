# Mesa Quant Master — alternativa gratuita para testes e uso pessoal leve.
# Banco fora da Render: use PostgreSQL Neon Free via DATABASE_URL (secreto).
# NÃO cria serviços pagos, bancos Render, discos ou jobs.
services:
  - type: web
    name: mesa-quant-master-api
    runtime: python
    plan: free
    region: virginia
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Render Free não permite preDeployCommand. As migrações ocorrem na
    # inicialização da instância, antes da API aceitar requisições.
    startCommand: bash scripts/start-free.sh
    healthCheckPath: /ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: API_DOCS_ENABLED
        value: "false"
      - key: SECURITY_HSTS_ENABLED
        value: "true"
      - key: FRONTEND_ORIGINS
        value: '["https://localhost","https://mesa-quant-master-web.onrender.com"]'
      - key: DATABASE_URL
        sync: false  # Colar no Render o URL TLS da Neon, nunca no GitHub
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_PUBLIC_URL
        sync: false
      - key: BRAPI_API_KEY
        sync: false
      - key: COINGECKO_DEMO_API_KEY
        sync: false
      - key: TWELVEDATA_API_KEY
        sync: false

  - type: web
    name: mesa-quant-master-web
    runtime: static
    rootDir: frontend_web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false  # URL pública HTTPS da API gerada pela Render
