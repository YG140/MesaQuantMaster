# API Android + PostgreSQL persistente. Requer conta Render conectada.
# Planos pagos deliberados: serviços gratuitos podem hibernar e o banco gratuito
# não tem garantias de persistência adequadas para carteira pessoal.
services:
  - type: web
    name: mesa-quant-master-api
    runtime: python
    plan: 0.5c-512mb
    region: virginia
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: API_DOCS_ENABLED
        value: "false"
      - key: SECURITY_HSTS_ENABLED
        value: "true"
      - key: FRONTEND_ORIGINS
        value: https://localhost
      - key: DATABASE_URL
        fromDatabase:
          name: mesa-quant-master-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_PUBLIC_URL
        sync: false
      - key: BRAPI_API_KEY
        sync: false
      - key: COINGECKO_DEMO_API_KEY
        sync: false
      - key: TWELVEDATA_API_KEY
        sync: false

  # Web HTTPS complementar para ativação de contas/recuperação de senha
  # e acesso alternativo ao APK. Endereço de API é configurado no painel.
  - type: web
    name: mesa-quant-master-web
    runtime: static
    rootDir: frontend_web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

databases:
  - name: mesa-quant-master-db
    databaseName: mesa_quant_master
    user: mesa_quant
    plan: 0.1c-256mb
    region: virginia
    ipAllowList: []
