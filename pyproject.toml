[project]
name = "mesa-quant-master"
version = "1.0.0"
description = "Sistema profissional para gestão quantitativa de investimentos."
readme = "README.MD"
requires-python = ">=3.13"

dependencies = [
    # API
    "fastapi==0.143.3",
    "starlette==1.6.0",
    "uvicorn[standard]==0.52.4",
    "httpx==0.28.1",
    "certifi>=2026.10.19",
    "pillow==13.0.0",
    "gitpython==3.2.1",

    # Banco de Dados
    "sqlalchemy==2.0.43",
    "alembic==1.19.1",
    "psycopg2-binary==2.9.10",

    # Configurações
    "pydantic==2.11.7",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.4",

    # Autenticação
"PyJWT==2.15.1",
"cryptography==50.0.0",
"pwdlib[argon2]>=0.3.0",
"python-multipart>=0.0.32",

    # Utilitários
    "email-validator>=2.2.0",
    "openai==3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.12.4",
    "black==26.10.1",
    "mypy==2.3.1",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
